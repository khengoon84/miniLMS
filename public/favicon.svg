<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@800;900&amp;display=swap');
      .fav-bg {
        fill: #FFFFFF;
      }
      .fav-border {
        stroke: #F1F3F5;
        stroke-width: 4;
      }
      .fav-n {
        font-family: 'Playfair Display', 'Bodoni Moda', 'Times New Roman', Times, Georgia, serif;
        font-weight: 900;
        font-size: 195px;
        fill: #EB5B24;
      }
      .fav-ibm {
        font-family: 'Playfair Display', 'Bodoni Moda', 'Times New Roman', Times, Georgia, serif;
        font-weight: 900;
        font-size: 104px;
        fill: #EB5B24;
        letter-spacing: -1px;
      }
    </style>
  </defs>

  <!-- Clean rounded badge with subtle border for dark & light browser tabs -->
  <rect width="256" height="256" rx="52" class="fav-bg fav-border" />

  <!-- NIBM Signature Monogram -->
  <text x="12" y="206" class="fav-n">N</text>
  <text x="140" y="206" class="fav-ibm">IBM</text>
</svg>
