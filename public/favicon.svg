<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@800;900&amp;display=swap');
      .fav-bg {
        fill: #FFFFFF;
      }
      .fav-border {
        stroke: #F1F3F5;
        stroke-width: 4;
      }
      .fav-text {
        font-family: 'Playfair Display', 'Bodoni Moda', 'Times New Roman', Times, Georgia, serif;
        font-weight: 900;
        fill: #EB5B24;
      }
    </style>
  </defs>

  <!-- Clean rounded badge with subtle border for dark & light browser tabs -->
  <rect width="256" height="256" rx="52" class="fav-bg fav-border" />

  <!-- NIBM Signature Monogram with generous margins ensuring full presentation -->
  <g class="fav-text">
    <text x="24" y="168" font-size="104">N</text>
    <text x="108" y="168" font-size="58" letter-spacing="0.5px">IBM</text>
  </g>
</svg>
