<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 270" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800;900&amp;display=swap');
      .nibm-orange {
        fill: #EB5B24;
      }
      .nibm-black {
        fill: #000000;
      }
      .n-text {
        font-family: 'Playfair Display', 'Bodoni Moda', 'Times New Roman', Times, Georgia, serif;
        font-weight: 800;
        font-size: 236px;
      }
      .ibm-text {
        font-family: 'Playfair Display', 'Bodoni Moda', 'Times New Roman', Times, Georgia, serif;
        font-weight: 800;
        font-size: 128px;
        letter-spacing: 2px;
      }
      .sub-text {
        font-family: 'Playfair Display', 'Bodoni Moda', 'Times New Roman', Times, Georgia, serif;
        font-weight: 700;
        font-size: 15px;
        letter-spacing: 1.5px;
      }
    </style>
  </defs>

  <!-- Group containing the full NIBM mark -->
  <g id="nibm-official-logo">
    <!-- Tall N (ascender reaches high up, baseline at 215) -->
    <text x="16" y="215" class="nibm-orange n-text">N</text>

    <!-- Aligned IBM at baseline 215 -->
    <text x="195" y="215" class="nibm-orange ibm-text">IBM</text>

    <!-- Subtitle: NATIONAL INSTITUTES OF BIOTECHNOLOGY MALAYSIA -->
    <text x="14" y="254" class="nibm-black sub-text" textLength="512" lengthAdjust="spacing">NATIONAL INSTITUTES OF BIOTECHNOLOGY MALAYSIA</text>
  </g>
</svg>
