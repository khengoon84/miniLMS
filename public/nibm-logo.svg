<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 270" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800;900&amp;display=swap');
      .nibm-orange {
        fill: #EB5B24;
      }
      .nibm-black {
        fill: #000000;
      }
      .n-text {
        font-family: 'Playfair Display', 'Bodoni Moda', 'Times New Roman', Times, Georgia, serif;
        font-weight: 800;
        font-size: 215px;
      }
      .ibm-text {
        font-family: 'Playfair Display', 'Bodoni Moda', 'Times New Roman', Times, Georgia, serif;
        font-weight: 800;
        font-size: 118px;
        letter-spacing: 1.5px;
      }
      .sub-text {
        font-family: 'Playfair Display', 'Bodoni Moda', 'Times New Roman', Times, Georgia, serif;
        font-weight: 700;
        font-size: 15px;
        letter-spacing: 1.5px;
      }
    </style>
  </defs>

  <!-- Group containing the full NIBM mark with generous margins -->
  <g id="nibm-official-logo">
    <!-- Tall N (baseline at 206) -->
    <text x="24" y="206" class="nibm-orange n-text">N</text>

    <!-- Aligned IBM at baseline 206 -->
    <text x="190" y="206" class="nibm-orange ibm-text">IBM</text>

    <!-- Subtitle: NATIONAL INSTITUTES OF BIOTECHNOLOGY MALAYSIA -->
    <text x="24" y="248" class="nibm-black sub-text" textLength="532" lengthAdjust="spacing">NATIONAL INSTITUTES OF BIOTECHNOLOGY MALAYSIA</text>
  </g>
</svg>
